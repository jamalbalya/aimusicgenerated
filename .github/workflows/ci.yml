name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        # The end-to-end suite runs against this build, so it is made with the
        # ZeroGPU backend pointed at a host that does not exist. Every test
        # serves that host itself, which is what lets the neural path be
        # exercised without reaching Hugging Face or spending GPU quota; the
        # rest of the suite already blocks *.hf.space, so it still sees the
        # no-backend case. The deployed build is made separately, in deploy.yml,
        # from the real Space address.
        run: npx vite build
        env:
          ACE_STEP_BACKEND: zerogpu
          ACE_STEP_SPACE_URL: https://fake-space.hf.space
          # A stand-in client id, for the same reason as the stand-in Space
          # above. The sign-in control only renders when a build carries one,
          # and every spec that drives a neural generation has to get past it;
          # without this the suite does not test the sign-in, it tests a build
          # that cannot sign in. Each test answers huggingface.co itself, so
          # this value never reaches an OAuth server and authenticates nothing:
          # it is a fixture, not a credential. The deployed build takes the real
          # one from a repository variable, in deploy.yml.
          VITE_HF_CLIENT_ID: not-a-real-oauth-client-id
          # The studio is private to one account, and the suite signs in as that
          # account through a stand-in. Matches TEST_HF_USERNAME in
          # tests/e2e/helpers/hfSignIn.ts; a build without it would admit the
          # stand-in anyway, and the test for "another account is kept out"
          # would then pass for the wrong reason.
          VITE_HF_ALLOWED_USERS: jamalbalya

      - name: Build the standalone single-file bundle
        run: npm run build:single

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
