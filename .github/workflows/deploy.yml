name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # The github-pages environment only accepts a deploy from the
      # repository's default branch. Drop this line once main is the default.
      - claude/free-music-generation-tools-fy4esb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify before publishing
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Check that Pages is switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "404" ]; then
            {
              echo "### GitHub Pages is not enabled yet"
              echo
              echo "A repository admin has to switch it on once — a workflow cannot,"
              echo "because enabling Pages needs admin rights that \`GITHUB_TOKEN\` is"
              echo "never granted."
              echo
              echo "**Settings → Pages → Build and deployment → Source: GitHub Actions**"
              echo
              echo "Then re-run this workflow. Every later push deploys automatically."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::GitHub Pages is not enabled. Set Settings -> Pages -> Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi
          echo "Pages is enabled (HTTP $status)."

      # Pages has to be switched on once, by hand, in the repository settings:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The workflow token cannot do it — enabling Pages needs admin rights that
      # GITHUB_TOKEN is never granted — so this step reads the configuration
      # rather than trying to create it.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # The site is served from https://<owner>.github.io/<repo>/, so every
        # asset URL has to be prefixed with the repository name.
        run: npx vite build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
