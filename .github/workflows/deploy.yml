name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # The github-pages environment only accepts a deploy from the
      # repository's default branch. Drop this line once main is the default.
      - free-music-generation-tools-fy4esb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify before publishing
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Check that Pages is switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "404" ]; then
            {
              echo "### GitHub Pages is not enabled yet"
              echo
              echo "A repository admin has to switch it on once — a workflow cannot,"
              echo "because enabling Pages needs admin rights that \`GITHUB_TOKEN\` is"
              echo "never granted."
              echo
              echo "**Settings → Pages → Build and deployment → Source: GitHub Actions**"
              echo
              echo "Then re-run this workflow. Every later push deploys automatically."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::GitHub Pages is not enabled. Set Settings -> Pages -> Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi
          echo "Pages is enabled (HTTP $status)."

      # Pages has to be switched on once, by hand, in the repository settings:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The workflow token cannot do it — enabling Pages needs admin rights that
      # GITHUB_TOKEN is never granted — so this step reads the configuration
      # rather than trying to create it.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # The public site's neural engine is the ZeroGPU Space. Its address is a
      # repository variable rather than a value in this file, so the Space can
      # move without a code change: Settings -> Secrets and variables -> Actions
      # -> Variables -> ACE_STEP_SPACE_URL = https://<owner>-<space>.hf.space
      # It is not a secret — it ends up in the public bundle either way — and no
      # token is involved: the Space is public and the browser calls it directly.
      - name: Check the neural backend configuration
        env:
          ACE_STEP_SPACE_URL: ${{ vars.ACE_STEP_SPACE_URL }}
        run: |
          if [ -z "$ACE_STEP_SPACE_URL" ]; then
            {
              echo "### ACE_STEP_SPACE_URL is not set"
              echo
              echo "The site will build and deploy, but its neural engine will show as not"
              echo "configured until the repository variable is set:"
              echo
              echo "**Settings → Secrets and variables → Actions → Variables → ACE_STEP_SPACE_URL**"
              echo
              echo "Value: the Space's own host, e.g. \`https://<owner>-<space>.hf.space\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::ACE_STEP_SPACE_URL repository variable is not set; the neural engine will show as not configured."
          else
            echo "Neural backend: zerogpu at $ACE_STEP_SPACE_URL"
          fi

      # The Hugging Face OAuth *public client* id. Without it the site still
      # builds and every offline tool works, but the neural engine cannot be
      # used at all: the studio says signing in is not configured, and no
      # generation can be authorised. That is quiet enough to ship by accident,
      # so it is said out loud here.
      - name: Check the sign-in configuration
        env:
          VITE_HF_CLIENT_ID: ${{ vars.VITE_HF_CLIENT_ID }}
        run: |
          if [ -z "$VITE_HF_CLIENT_ID" ]; then
            {
              echo "### VITE_HF_CLIENT_ID is not set"
              echo
              echo "The site will build and deploy, but **the neural engine will be"
              echo "unusable**: visitors will see \"Signing in is not configured in this"
              echo "build\" and cannot generate. The offline procedural engine is"
              echo "unaffected."
              echo
              echo "**Settings → Secrets and variables → Actions → Variables → VITE_HF_CLIENT_ID**"
              echo
              echo "Use the client id of the Hugging Face OAuth application. It is a"
              echo "*public client*: it has no secret, and every OAuth flow sends this"
              echo "value to the browser, so it is a variable and not a secret. Never"
              echo "put a client secret here \u2014 this build has no use for one."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::VITE_HF_CLIENT_ID repository variable is not set; the neural engine will be unusable because visitors cannot sign in."
          else
            echo "Sign-in: Hugging Face OAuth public client is configured."
          fi

      - name: Build
        # The site is served from https://<owner>.github.io/<repo>/, so every
        # asset URL has to be prefixed with the repository name.
        run: npx vite build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # The commit the About page reports. GITHUB_SHA is already in every
          # step's environment and would be picked up on its own; naming it here
          # makes the wiring visible, and is what tests/unit/build-env.test.ts
          # checks, so a future edit that drops it fails before it deploys.
          BUILD_SHA: ${{ github.sha }}
          # ACE_STEP_BACKEND defaults to zerogpu for the public site and can be
          # overridden with a repository variable of the same name.
          ACE_STEP_BACKEND: ${{ vars.ACE_STEP_BACKEND || 'zerogpu' }}
          ACE_STEP_SPACE_URL: ${{ vars.ACE_STEP_SPACE_URL }}
          # Optional; each falls back to the default documented in
          # docs/architecture/environment.md when its variable is unset.
          ACE_STEP_SPACE_AUTO_DURATION: ${{ vars.ACE_STEP_SPACE_AUTO_DURATION }}
          ACE_STEP_SPACE_MAX_DURATION: ${{ vars.ACE_STEP_SPACE_MAX_DURATION }}
          ACE_STEP_SPACE_TIMEOUT_SECONDS: ${{ vars.ACE_STEP_SPACE_TIMEOUT_SECONDS }}
          # The OAuth public client id, from the repository variable checked
          # above. Public by design and safe in the bundle; there is no client
          # secret anywhere in this workflow, the bundle or the frontend.
          VITE_HF_CLIENT_ID: ${{ vars.VITE_HF_CLIENT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
